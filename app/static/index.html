<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal RAG</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M3 7l9 5 9-5M12 12v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <span>Personal RAG</span>
        </div>
        <button class="icon-btn" id="collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 4v16M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        New chat
      </button>

      <nav class="conversation-list" id="conversation-list" aria-label="Conversation history"></nav>

      <div class="sidebar-footer">
        <span id="status" class="status" role="status">connecting…</span>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <button class="icon-btn sidebar-open-btn" id="open-sidebar-btn" title="Open sidebar" aria-label="Open sidebar" hidden>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 4v16M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </button>

    <main class="main">
      <header class="main-header">
        <h1 id="conversation-title">New chat</h1>
        <button class="icon-btn" id="rename-btn" title="Rename conversation" aria-label="Rename conversation" hidden>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M3 7l9 5 9-5M12 12v10" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
          <p>Ask about your projects or site.<br>Every answer cites the repo, file, or page it came from.</p>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="question">Ask a question</label>
        <textarea id="question" placeholder="Ask about your projects or site…" rows="1" autofocus></textarea>
        <button type="submit" id="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <h2 id="modal-title"></h2>
      <p id="modal-message" hidden></p>
      <input id="modal-input" type="text" hidden />
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="modal-btn secondary">Cancel</button>
        <button type="button" id="modal-confirm" class="modal-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
